<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR Photocard</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>

  <style>
    html, body { margin: 0; overflow: hidden; }
    #loading {
      position: fixed; inset: 0; z-index: 9999;
      background: #000; color: #fff;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 0 24px; text-align: center;
      font-family: sans-serif; font-size: 16px; line-height: 1.5;
      transition: opacity 0.4s;
    }
    #loading.hide { opacity: 0; pointer-events: none; }
    .spinner {
      width: 40px; height: 40px; margin-bottom: 16px;
      border: 4px solid #444; border-top-color: #fff;
      border-radius: 50%; animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>

  <script>
    AFRAME.registerComponent('fix-material', {
      init: function () {
        this.el.addEventListener('model-loaded', () => {
          const mesh = this.el.getObject3D('mesh');
          if (!mesh) return;
          mesh.traverse((node) => {
            if (node.isMesh && node.material) {
              node.material.depthWrite = true;
              node.material.alphaTest = 0.5;
              node.material.needsUpdate = true;
            }
          });
        });
      }
    });
  </script>
</head>

<body>

  <div id="loading">
    <div class="spinner"></div>
    <div id="loading-text">Loading...</div>
  </div>

  <a-scene
    mindar-image="
      imageTargetSrc: ./targets.mind;
      autoStart: false;
      uiLoading: no;
      uiScanning: yes;
      uiError: yes;
      filterMinCF: 0.001;
      filterBeta: 15;
      missTolerance: 10;
      warmupTolerance: 5;
    "
    color-space="sRGB"
    renderer="colorManagement: true; physicallyCorrectLights: true;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
  >

    <a-assets timeout="30000">
      <a-asset-item id="avatarModel" src="./model.glb"></a-asset-item>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity mindar-image-target="targetIndex: 0">

      <!-- Put the two background cubes inside this entity -->

      <a-entity
        id="model"
        gltf-model="#avatarModel"
        position="0 -0.2 0"
        scale="0.3 0.3 0.3"
        rotation="68 0 0"
        animation-mixer="loop: repeat;"
        fix-material>
      </a-entity>

    </a-entity>

  </a-scene>

  <script>
    const scene = document.querySelector('a-scene');
    const assets = document.querySelector('a-assets');
    const loading = document.getElementById('loading');
    const loadingText = document.getElementById('loading-text');

    let assetsReady = assets.hasLoaded;
    let sceneReady = scene.hasLoaded;
    let started = false;

    function tryStart() {
      if (started || !assetsReady || !sceneReady) return;
      started = true;
      loadingText.textContent = 'Please allow camera access';
      scene.systems['mindar-image-system'].start();
    }

    if (!assetsReady) assets.addEventListener('loaded', () => { assetsReady = true; tryStart(); });
    if (!sceneReady) scene.addEventListener('loaded', () => { sceneReady = true; tryStart(); });
    tryStart();

    scene.addEventListener('arReady', () => {
      loading.classList.add('hide');
      setTimeout(() => loading.remove(), 500);
    });

    scene.addEventListener('arError', () => {
      loadingText.textContent = "Couldn't start the camera. Please check your permissions and refresh the page. In Safari, tap the AA icon in the address bar, open Website Settings, and set Camera to Allow.";
    });
  </script>

</body>
</html>
